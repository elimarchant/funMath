<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>24</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <header class="top">
    <a class="home" href="../../index.html" title="Back to all games">← FunMath</a>
    <h1>24</h1>
    <button id="mute" class="icon-btn" aria-label="Toggle sound" title="Sound on/off">🔊</button>
  </header>

  <main class="game">
    <section class="controls card">
      <label class="target-box">
        <span>Target</span>
        <input id="targetInput" type="number" inputmode="numeric" min="0" max="50" value="24"
               aria-label="Target number (0 to 50). Press Enter or click away to start a new puzzle.">
      </label>

      <div class="levels" role="group" aria-label="Difficulty">
        <button class="chip active" data-level="easy" aria-pressed="true">😀 Easy</button>
        <button class="chip" data-level="hard" aria-pressed="false">🔥 Hard</button>
      </div>

      <div class="stats" aria-live="polite">
        <span title="Puzzles solved in a row">🔥 Streak <b id="streak">0</b></span>
        <span title="Puzzles solved">⭐ Solved <b id="solved">0</b></span>
      </div>
    </section>

    <p id="levelNote" class="note"></p>

    <section class="stage card" id="stage">
      <div class="tray-label">Your numbers <small>(drag them down, or just tap)</small></div>
      <div id="tray" class="tray" aria-label="Number tiles"></div>

      <div class="board" id="board" aria-label="Equation board">
        <div class="numcell">
          <div class="bz open" data-kind="open" data-i="0"></div>
          <div class="slot num" data-kind="num" data-i="0"></div>
          <div class="bz close" data-kind="close" data-i="0"></div>
        </div>
        <div class="slot op" data-kind="op" data-i="0"></div>
        <div class="numcell">
          <div class="bz open" data-kind="open" data-i="1"></div>
          <div class="slot num" data-kind="num" data-i="1"></div>
          <div class="bz close" data-kind="close" data-i="1"></div>
        </div>
        <div class="slot op" data-kind="op" data-i="1"></div>
        <div class="numcell">
          <div class="bz open" data-kind="open" data-i="2"></div>
          <div class="slot num" data-kind="num" data-i="2"></div>
          <div class="bz close" data-kind="close" data-i="2"></div>
        </div>
        <div class="slot op" data-kind="op" data-i="2"></div>
        <div class="numcell">
          <div class="bz open" data-kind="open" data-i="3"></div>
          <div class="slot num" data-kind="num" data-i="3"></div>
          <div class="bz close" data-kind="close" data-i="3"></div>
        </div>
        <div class="equals">=</div>
        <div class="goal" id="goal">24</div>
      </div>

      <div class="tray-label">Signs <small>(use each as many times as you like)</small></div>
      <div class="palette" id="palette">
        <div class="tile opt" data-op="+">+</div>
        <div class="tile opt" data-op="-">−</div>
        <div class="tile opt" data-op="*">×</div>
        <div class="tile opt" data-op="/">÷</div>
      </div>

      <div class="brackets-only">
        <div class="tray-label">Brackets <small>(drag one into the gap before or after a number)</small></div>
        <div class="palette" id="bpalette">
          <div class="tile br" data-br="(">(</div>
          <div class="tile br" data-br=")">)</div>
        </div>
      </div>

      <p class="rule" id="rule"></p>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <div class="overlay" id="overlay" aria-hidden="true"></div>
    </section>

    <section class="actions">
      <button id="clear" class="btn grey">↺ Clear</button>
      <button id="help" class="btn amber">💡 Help <small id="helpCount"></small></button>
      <button id="check" class="btn green big">✔ Check</button>
      <button id="newq" class="btn blue">🎲 New question</button>
    </section>
  </main>

  <script src="../../assets/js/sound.js"></script>
  <script src="solver.js"></script>
  <script src="game.js"></script>
</body>
</html>
